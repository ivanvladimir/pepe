# Conversation example for simple hello and ask a name
settings:
    system_name: "[blue]Pepe[/blue]"
    system_name_html: "<span style='color:blue'>Pepe</span>"
    user_name: "[aquamarine1]Usuario[/aquamarine1]"
    user_name_html: "<span style='color:blue'>Usuario</span>"

url_apis:
    chatgpt: "http://127.0.0.1:8010/chatgpt/"

templates:
    - 'resources/messages.yaml'

prompts:
    - 'resources/prompts.yaml'

strategies:
    greet:
        - say GREET

    emergency:
        - say "Estás pasando una emergencia, por favor marca el 911 para que te atiendan"
        - stop

    response_to_greet:
      - execute self.slots['v1_greet']=self.slots['v1_res']
      - post chatgpt generate_response 'messages':[{'role':'system', 'content':'Regresa el siguiente saludo, con poca emoción y no ofrezcas ayuda. Ejemplos - Hola doctora gracias por recibirme, mucho gusto doctor gracias por verme'},{'role':'user','content':v1_greet}] response
      - say response['response'] 

    response_to_question:
      - post chatgpt generate_response 'messages':[{'role':'system', 'content':'Responde la siguiente pregunta de forma breve, con poca emoción.'},{'role':'system', 'content':context},{'role':'user','content':question}] response
      - say response['response'] 

    response_to_interaction:
      - post chatgpt generate_response 'messages':[{'role':'system', 'content':'Responde la siguiente observación de un o una médico de forma breve y amable, pero expresa poca emoción.'},{'role':'system', 'content':context},{'role':'user','content':question}] response
      - say response['response'] 

    continue_false:
      - set_slot continue_stage False

    v1:
      - execute self.slots['v1_paciente']=self.prompts['v1_paciente']
      - execute self.slots['v1_tipo']=self.prompts['v1_tipo']
      - say "Me enviaron con usted para que me oriente"
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v1

    save_question_v1:
      - execute self.slots['question']=self.slots['v1_res']
      - execute self.slots['context']=self.slots['v1_paciente']

    wrong_topic:
      - if count_wrong_topic>=5 then say "Hay varias veces que no entiendo..."
      - execute self.slots['count_wrong_topic']+=1
      - if count_wrong_topic>=10 then say "Lo siento, no he entendido nada de lo que me dices"
      - if count_wrong_topic>=10 then exit

    check_topic:
      - post chatgpt generate_response 'messages':[{'role':'user', 'content':res},{'role':'user','content':in_topic}] response
      - set_slot topic_correct response['response']
      - if topic_correct=="no" then solve wrong_topic

    eval_v1:
      - input v1_res
      - set_slot res v1_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v1_tipo},{'role':'user','content':v1_res}] response
      - set_slot answer response['response']
      - solve save_question_v1
      - if answer=='personal_question' then solve response_to_question
      - if answer=='confidential' then say "Que bueno que esto es confidencial"
      - if answer=='introduction' then solve response_to_greet
      - if answer=='continuation' then solve continue_false
      - if answer=='continuation' then say "Últimamente he notado algunos problemas, me dicen que tomo mucho"
      - execute self.slots['count']+=1
      - if count>=5 then solve continue_false

    v2:
      - execute self.slots['v2_paciente']=self.prompts['v2_paciente']
      - execute self.slots['v2_tipo']=self.prompts['v2_tipo']
      - say "Francamente no sé qué hacer. Últimamente me he sentido muy mal."
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v2

    save_question_v2:
      - execute self.slots['question']=self.slots['v2_res']
      - execute self.slots['context']=self.slots['v2_paciente']

    eval_v2:
      - input v2_res
      - set_slot res v2_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v2_tipo},{'role':'user','content':v2_res}] response
      - set_slot response response['response']
      - solve save_question_v2
      - if response=='abstinence' then solve response_to_question
      - if response=='intoxication' then solve response_to_question
      - if response=='last_drink' then solve response_to_question
      - if response=='understanding' then say "Gracias, por sus palabras."
      #- if response=='relaxation' then solve relaxation
      - if response=='other_substance' then solve response_to_question
      - if response=='other_substance' then solve continue_false
      - execute self.slots['count']+=1
      - if count>=3 then solve continue_false

    v3:
      - execute self.slots['v3_paciente']=self.prompts['v3_paciente']
      - execute self.slots['v3_tipo']=self.prompts['v3_tipo']
      - say "He notado que bebo mucho más que antes."
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v3

    save_question_v3:
      - execute self.slots['question']=self.slots['v3_res']
      - execute self.slots['context']=self.slots['v3_paciente']

    eval_v3:
      - input v3_res
      - set_slot res v3_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v3_tipo},{'role':'user','content':v3_res}] response
      - set_slot response response['response']
      - solve save_question_v3
      - if response=='indaga' then solve response_to_question
      - if response=='indaga_deep' then solve response_to_question
      - if response=='indaga_shallow' then solve response_to_question
      - if response=='indaga_deep' then solve continue_false
      - execute self.slots['count']+=1
      - if count>=3 then solve continue_false

    v4:
      - execute self.slots['v4_paciente']=self.prompts['v4_paciente']
      - execute self.slots['v4_tipo']=self.prompts['v4_tipo']
      - say "Aunque me gusta beber, también me preocupa lo que ya me está pasando y lo que me pueda pasar si sigo así"
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v4

    save_question_v4:
      - execute self.slots['question']=self.slots['v4_res']
      - execute self.slots['context']=self.slots['v4_paciente']

    eval_v4:
      - input v4_res
      - set_slot res v4_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v4_tipo},{'role':'user','content':v4_res}] response
      - set_slot response response['response']
      - solve save_question_v4
      - if response=='consecuence' then solve response_to_question
      - if response=='syntoms' then solve response_to_question
      - if response=='normal' then solve response_to_question
      - if response=='normal' then solve continue_false
      - execute self.slots['count']+=1
      - if count>=2 then solve continue_false

    v5:
      - execute self.slots['v5_paciente']=self.prompts['v5_paciente']
      - execute self.slots['v5_tipo']=self.prompts['v5_tipo']
      - say "Me parece que con todo esto que hemos comentado, quizá ya sea momento de hacer un cambio."
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v5

    save_question_v5:
      - execute self.slots['question']=self.slots['v5_res']
      - execute self.slots['context']=self.slots['v5_paciente']

    eval_v5:
      - input v5_res
      - set_slot res v5_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v5_tipo},{'role':'user','content':v5_res}] response
      - set_slot response response['response']
      - solve save_question_v5
      - solve response_to_interaction
      - if response=='support' then say "Muchas gracias, ya me siento listo para realizarlo, aunque no sé bien cómo"
      - if response=='disavantage' then say "Sí, estoy de acuerdo, aunque las consecuencias malas no siempre me pasan"
      - if response=='treatment' then say "Pero, no estoy seguro de poder ir o de necesitarlo, creí que usted me podría ayudar."
      - if response=='normal' then solve continue_false
      - execute self.slots['count']+=1
      - if count>=1 then solve continue_false

    v6:
      - execute self.slots['v6_paciente']=self.prompts['v6_paciente']
      - execute self.slots['v6_tipo']=self.prompts['v6_tipo']
      - say "¿Qué puedo hacer? ¿Cree que estoy muy mal?"
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v6

    save_question_v6:
      - execute self.slots['question']=self.slots['v6_res']
      - execute self.slots['context']=self.slots['v6_paciente']

    eval_v6:
      - input v6_res
      - set_slot res v6_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v6_tipo},{'role':'user','content':v6_res}] response
      - set_slot response response['response']
      - solve save_question_v6
      - solve response_to_interaction
      - if response=='support' then say "Gracias, ¿qué puedo hacer?"
      - if response=='alternatives' then say "Ok, me alivia saber que existen alternativas y que estoy a tiempo de hacer algo antes de que esto se vuelva más grave."
      - if response=='consecuences' then say "Ok, entonces estoy en riesgo de volverme adicto. Definitavamente no quiero eso. "
      - if response=='suspend' then say "¿Dejar de beber totalmente? No sé si pueda lograrlo."
      - if response=='normal' then solve continue_false
      - execute self.slots['count']+=1
      - if count>=1 then solve continue_false

    v7:
      - execute self.slots['v7_paciente']=self.prompts['v7_paciente']
      - execute self.slots['v7_tipo']=self.prompts['v7_tipo']
      - say "Estoy dispuesto a intentarlo, aunque pienso que será muy difícil pues el alcohol me ha ayudado muchas veces a relajarme. No sé por dónde empezar."
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v7

    save_question_v7:
      - execute self.slots['question']=self.slots['v7_res']
      - execute self.slots['context']=self.slots['v7_paciente']

    eval_v7:
      - input v7_res
      - set_slot res v7_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v7_tipo},{'role':'user','content':v7_res}] response
      - set_slot response response['response']
      - solve save_question_v7
      - solve response_to_interaction
      - if response=='strategies' then say "Me parecen muy buenas ideas. Definitivamente puedo mejorar mi alimentación y dormir más temprano para levantarme a correr por las mañana. También creo que los ejercicios de respiración me ayudarán cuando me sienta estresado"
      - if response=='excercise' then say "Me cuesta mucho trabajo controlar mis emociones, pero puedo intentarlo. También intentaré bajarle al estrés para no terminar consumiendo."
      - if response=='excercise' then say "Me cuesta mucho trabajo hacer ejercicio, pero puedo intentarlo. También intentaré bajarle al estrés para no terminar consumiendo."
      - if response=='prescription' then say "No me gustaría tomar medicamento, pero si usted lo considera, lo valoraré. Creo que primero podría intentar dejar de beber, aunque será muy difícil."
      - if response=='normal' then solve continue_false
      - execute self.slots['count']+=1
      - if count>=1 then solve continue_false

    v8:
      - execute self.slots['v8_paciente']=self.prompts['v8_paciente']
      - execute self.slots['v8_tipo']=self.prompts['v8_tipo']
      - say "Intentaré estas alternativas, pero por lo pronto, ¿qué puedo hacer este viernes si mis amigos me invitan a beber?"
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v8

    save_question_v8:
      - execute self.slots['question']=self.slots['v8_res']
      - execute self.slots['context']=self.slots['v8_paciente']

    eval_v8:
      - input v8_res
      - set_slot res v8_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v8_tipo},{'role':'user','content':v8_res}] response
      - set_slot response response['response']
      - solve save_question_v8
      - solve response_to_interaction
      - if response=='plan' then say "Muy bien, creo que sí, puedo hacer un plan con mi esposa para ir al cine el viernes y avisarles desde antes a mis amigos que no iré a beber con ellos."
      - if response=='avoid' then say "Creo que será difícl negarme, pero lo puedo intentar, Sobre el ejercicio, no estoy seguro, pues a mi me gusta hacerlo por las mañanas y lo de mis amigos es por la tarde."
      - if response=='forbiden' then say "No creo que pueda evitarlos, pues trabajamos juntos. Me costará trabajo verlos y no ir con ellos a consumir. "
      - execute self.slots['count']+=1
      - if count>=1 then solve continue_false

    v9:
      - execute self.slots['v9_paciente']=self.prompts['v9_paciente']
      - execute self.slots['v9_tipo']=self.prompts['v9_tipo']
      - say "Este viernes intentaré no consumir, pero me gustaría poder hablar más sobre mi consumo, el estrés en mi trabajo, los problemas con mi esposa…"
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v9

    save_question_v9:
      - execute self.slots['question']=self.slots['v9_res']
      - execute self.slots['context']=self.slots['v9_paciente']

    eval_v9:
      - input v9_res
      - set_slot res v9_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v9_tipo},{'role':'user','content':v9_res}] response
      - set_slot response response['response']
      - solve save_question_v9
      - solve response_to_interaction
      - if response=='followup' then say "Muchas gracias, creo que la segunda opción es la que me queda más cerca. Un primo fue a ese Centro y me cuenta que la atención fue buena."
      - if response=='avoid' then say "Gracias, pero pensaba quizá en un grupo de autoayuda que hay por mi casa."
      - if response=='forbiden' then say "Ok, está bien, gracias"
      - execute self.slots['count']+=1
      - if count>=1 then solve continue_false

    v10:
      - execute self.slots['v10_paciente']=self.prompts['v10_paciente']
      - execute self.slots['v10_tipo']=self.prompts['v10_tipo']
      - say "Le agradezco la atención que me dio el día de hoy. Intentaré en la semana reducir mi consumo de alcohol para ya no tener más problemas"
      - set_slot continue_stage True
      - set_slot count 0
      - while continue_stage==True then solve eval_v10

    save_question_v10:
      - execute self.slots['question']=self.slots['v10_res']
      - execute self.slots['context']=self.slots['v10_paciente']

    eval_v10:
      - input v10_res
      - set_slot res v10_res
      - solve check_topic
      - post chatgpt generate_structured 'messages':[{'role':'system', 'content':v10_tipo},{'role':'user','content':v10_res}] response
      - set_slot response response['response']
      - solve save_question_v10
      - solve response_to_interaction
      - if response=='appointment' then say "Claro que sí, nos vemos en quince días. Muchas gracias."
      - if response=='avoid' then say "Lo sé, lo intentaré. Muchas gracias."
      - if response=='forbiden' then say "Muchas gracias por su atención."
      - execute self.slots['count']+=1
      - if count>=1 then solve continue_false

script:
    - set_slot count_wrong_topic 0
    - execute self.slots['in_topic']=self.prompts['en_topico']
    - solve greet
    - solve v1
    - solve v2
    - solve v3
    - solve v4
    - solve v5
    - solve v6
    - solve v7
    - solve v8
    - solve v9
    - solve v10
