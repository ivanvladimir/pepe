plugins:
  - filters.py

templates:
  - messages.yaml

prompts:
  - prompts.yaml

strategies:
  saludar:
    - say GREET

  despedida:
    - say "Me despido del chat"

  main_loop:
    - listen intervencion_doctor
    - .build_shared_info mentioned | set shared_info
    - llm:
        system: main
        user: intervencion_doctor
        output: respuesta_a_doctor
    - say "{respuesta_a_doctor}"
    - llm_extract:
        system: extract_info
        user: intervencion_doctor
        output: _finished
    - info slots

slots:
  _finished: False
  shared_info: ""
  bio:
    name: José González
    age: 30
    marital_status: casado
    ocupation: repartidor en empresa de paqueteria
    married_years: 4
    kids: 1 
    kids_ages: 3
    wifes_name: Isabel Pérez
    household_situation: departamento rentado
  mentioned:
    general:
      name: José González

script:
  - solve saludar
  - while _finished == False then solve main_loop
  - solve despedida

cleanup:
  - llm evaluation eval
  - save_document:
      title: "Evaluación"
      kind: "ia"
      variable: eval
      tags: [evaluation, evaluation_ia]
