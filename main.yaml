conversations:
  - stage1.yaml

plugins:
  - filters.py

templates:
  - messages.yaml

prompts:
  - prompts.yaml

strategies:
  saludar:
    - say GREET

  despedida:
    - say "Me despido del chat"

  main_loop:
    - listen intervencion_doctor
    - llm:
        system: main
        user: intervencion_doctor
        output: respuesta_a_doctor
    - say "{respuesta_a_doctor}"
    - llm_extract:
        system: ya_termino
        user: "Termina"
        output: finished
    - info slots

slots:
  _finished: False
  bio:
    name: José González
    age: 34
    marital_status: casado
    married_years: 4
    kids: sin niños
    wifes_name: Isabel Pérez
  mentioned:
    general:
      name: José González

script:
  - solve saludar
  - while not _finished then solve main_loop
  - solve despedida

