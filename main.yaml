conversations:
  - stage1.yaml

plugins:
  - filters.py

templates:
  - messages.yaml

prompts:
  - prompts.yaml

strategies:
  saludar:
    - sleep 1 # Just wait for a second when only greeting
    - say GREET
    - say "me enviaron con usted para que me oriente ..."

  escuchar:
    - listen interaccion

script:
  - solve saludar
  - solve escuchar
  - info slots
  - llm:
      system: v1_tipo
      user: interaccion
      output: tipo_interaccion
  - info slots
  - say "Creo que quisiste decir algo como {tipo_interaccion}"

