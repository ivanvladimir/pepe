{% extends 'base.html' %}

{% block script %}
	<script type="text/javascript" charset="utf-8">
        $(document).ready(function(){
            namespace = '{{prefix}}';
            var msgCount = 1;
            var client_id = Date.now()
            var spk='USER';
            var port='{{port}}';
            var converter = new showdown.Converter();
            if(port.length>0){
                var ws = new WebSocket('{{protocol}}://{{server}}:{{port}}' + namespace+`${client_id}`);
            }else{
                var ws = new WebSocket('{{protocol}}://{{server}}' + namespace+`${client_id}`);
            }
            ws.addEventListener("open", (event) => {
            var preferences={};
                {% for k,v in data.items() %}
                	preferences["{{k}}"]="{{v}}";
                {% endfor %}
                ws.send(JSON.stringify({'cmd':'start','conversation':"{{chat_name}}",'data':preferences }));
            });

            $('#send').click(function(e){sendMSG(e)});

            $('#msg_input').focus();

            function sleep(milliseconds) {
                  const date = Date.now();
                  let currentDate = null;
                  do {
                          currentDate = Date.now();
                        } while (currentDate - date < milliseconds);
            }

            function sendMSG(e) {
                var msg = String($('#msg_input').val());
                if(msg.trim().length>0){
                    ws.send(JSON.stringify({'cmd':'input completed','msg':msg,'client_id':client_id}));
                    showUserMessage(msg,getCurrentTimestamp());
                    $('#msg_input').val('');
                    msgCount += 1;
      			    return false;
                }
    	    }

            // Get the input field
            var input = document.getElementById("msg_input");

            // Execute a function when the user presses a key on the keyboard
            input.addEventListener("keypress", function(event) {
                  // If the user presses the "Enter" key on the keyboard
                  if (event.key === "Enter") {
                          // Cancel the default action, if needed
                          event.preventDefault();
                          // Trigger the button element with a click
                          document.getElementById("send").click();
                        }
            });

	    var to_continue=true;

            ws.onmessage = function(event) {
			data=JSON.parse(event.data);
                	// SAY
			if(data.cmd=="say"){
                    		html = converter.makeHtml(data.msg);
                    		showBotMessage(html,getCurrentTimestamp());
                    		sleep(400);
				};
                	// Finish
	            	if(data.cmd=="finish"){
                    		document.getElementById('msg_input').disabled = true;
                    		document.getElementById('chat_window').disabled = true;
                    		document.getElementById('bye_message').removeAttribute('hidden');
                    		window.scrollTo(0, document.body.scrollHeight);
				to_continue=false;
			};
            };


            ws.onclose = function(e) {
                    console.log('Socket is closed.');
     		    document.getElementById('msg_input').disabled = true;
                    document.getElementById('chat_window').disabled = true;
		    if(to_continue){
			console.log('Not finished normal. Reconnect will be attempted in 1 second.', e.reason);
                        if(port.length>0){
                                ws = new WebSocket('{{protocol}}://{{server}}:{{port}}' + namespace+`${client_id}`);
                            }else{
                                ws = new WebSocket('{{protocol}}://{{server}}' + namespace+`${client_id}`);
                            }
    				document.getElementById('msg_input').disabled = false;
                    		document.getElementById('chat_window').disabled = false;
		 
			}else{
				document.getElementById('close_message').removeAttribute('hidden');
                    		window.scrollTo(0, document.body.scrollHeight);
			}
                    };

            ws.onerror = function(err) {
                    console.log('Socket had an error.');
		    document.getElementById('msg_input').disabled = true;
                    document.getElementById('chat_window').disabled = true;
		    if(to_continue){
			console.log('Not finished normal. Reconnect will be attempted in 1 second.', e.reason);
                        if(port.length>0){
                                ws = new WebSocket('{{protocol}}://{{server}}:{{port}}' + namespace+`${client_id}`);
                            }else{
                                ws = new WebSocket('{{protocol}}://{{server}}' + namespace+`${client_id}`);
                        }
      		    document.getElementById('msg_input').disabled = false;
                    document.getElementById('chat_window').disabled = false;
		     	}else{
				document.getElementById('error_message').removeAttribute('hidden');
                    		window.scrollTo(0, document.body.scrollHeight);
			}
                    };
        });
    </script>
{% endblock %}

{% block content %}
	<div class="container">
		<div class="row padded_row">
				<div id="chat_window" class="chat_window">
					<div class="top_menu">
                        <div class="title">PEPE 🧑</div>
					</div>

					<!-- dynamically rendered -->
					<ul class="messages"></ul>

					<!-- input -->
					<div class="bottom_wrapper">
						<input id="msg_input" placeholder="Escribe aquí"/>
                        <div id="send" class="app_button_1">Enviar</div>
					</div>
				</div>
		</div>
		<div id="bye_message" class="row padded_row" hidden='True'>
		    <div class="col-md-4 mx-auto">
		    <div class="card" style="width: 18rem;">
			<div class="card-body">
			<h5 class="card-title">¡Gracias por interactuar!</h5>
			</div>
		    </div>
		    </div>
		</div>
	</div>
{% endblock %}
